---
layout: default
---
<style>
  .section-body.hidden {
    display: none;
  }

  .post-section {
    cursor: pointer;
    margin-bottom: 1rem;
    padding: 1rem;
    border: 1px solid #ddd;
    border-radius: 6px;
  }

  .post-section:hover {
    background: #f9f9f9;
  }

  /* Level styling */
  .level-1 { background: #fff; }
  .level-2 { margin-left: 1.5rem; background: #fafafa; border-color: #ccc; }
  .level-3 { margin-left: 3rem; background: #f5f5f5; border-color: #bbb; }

  .content-block {
    margin-bottom: 1rem;
  }

  .content-block img {
    max-width: 100%;
    border-radius: 6px;
    margin-top: 0.5rem;
  }
</style>

<script>
  function toggleSection(section) {
    const body = section.querySelector('.section-body');
    body.classList.toggle('hidden');
  }
</script>

<article>
  <h1>{{ page.title }}</h1>

  {% for section in page.sections %}
    <section class="post-section level-{{ section.level }}" onclick="toggleSection(this)">
      <h2>{{ section.heading }}</h2>

      <div class="section-body">
        {% for block in section.contents %}
          <div class="content-block">
            <div class="content-text">
              {{ block.text | markdownify }}
            </div>

            {% if block.image %}
              <img src="{{ block.image }}" alt="{{ section.heading }}">
            {% endif %}
          </div>
        {% endfor %}
      </div>
    </section>
  {% endfor %}
</article>
